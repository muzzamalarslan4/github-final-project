<script>
function searchPlaces() {
    const keyword = document.getElementById("searchInput").value.toLowerCase();
    const results = document.getElementById("results");

    results.innerHTML = "";

    if (keyword.includes("beach")) {
        results.innerHTML = `
            <div class="place">
                <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e"
                     alt="Beautiful Beach">
                <h2>Beautiful Beach</h2>
                <p>Enjoy a relaxing vacation on a beautiful tropical beach.</p>
            </div>

            <div class="place">
                <img src="https://images.unsplash.com/photo-1510414842594-a61c69b5ae57"
                     alt="Tropical Beach">
                <h2>Tropical Beach</h2>
                <p>Discover this amazing tropical beach destination.</p>
            </div>
        `;
    } else {
        results.innerHTML = "<p>Please search for beach.</p>";
    }
}

function clearResults() {
    document.getElementById("searchInput").value = "";
    document.getElementById("results").innerHTML = "";
}
</script>
